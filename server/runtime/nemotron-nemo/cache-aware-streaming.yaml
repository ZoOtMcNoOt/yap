asr:
  model_name: /models/asr/nemotron-3.5-asr-streaming-0.6b.nemo
  device: cuda
  device_id: 0
  compute_dtype: bfloat16
  use_amp: false
  decoding:
    strategy: greedy_batch
    preserve_alignments: false
    fused_batch_size: -1
    greedy:
      use_cuda_graph_decoder: false
      enable_per_stream_biasing: false
      preserve_frame_confidence: false

itn:
  left_padding_size: 4
  batch_size: 32
  n_jobs: 1

confidence:
  exclude_blank: true
  aggregation: mean
  method_cfg:
    name: entropy
    entropy_type: tsallis
    alpha: 0.5
    entropy_norm: exp

endpointing:
  stop_history_eou: 800
  residue_tokens_at_end: 2

streaming:
  sample_rate: 16000
  batch_size: 8
  num_slots: 8
  word_boundary_tolerance: 4
  att_context_size: [56, 13]
  use_cache: true
  use_feat_cache: true
  chunk_size_in_secs: null
  request_type: frame

matmul_precision: high
log_level: 40
pipeline_type: cache_aware
asr_decoding_type: rnnt
enable_itn: false
enable_nmt: false
asr_output_granularity: segment
return_tail_result: true
