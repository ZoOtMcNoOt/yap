[[package]]
name = "yap-server"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "mcp" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic" },
    { name = "pyjwt", extra = ["crypto"] },
    { name = "pyyaml" },
    { name = "websockets" },
]

[package.optional-dependencies]
evaluation = [
    { name = "rapidfuzz" },
    { name = "regex" },
]
test = [
    { name = "numpy" },
]

[package.dev-dependencies]
dev = [
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "mcp", specifier = "==2.0.0" },
    { name = "numpy", marker = "extra == 'test'", specifier = "==2.4.6" },
    { name = "psycopg", extras = ["binary"], specifier = "==3.3.4" },
    { name = "pydantic", specifier = "==2.13.4" },
    { name = "pyjwt", extras = ["crypto"], specifier = "==2.13.0" },
    { name = "pyyaml", specifier = "==6.0.3" },
    { name = "rapidfuzz", marker = "extra == 'evaluation'", specifier = "==3.14.5" },
    { name = "regex", marker = "extra == 'evaluation'", specifier = "==2026.7.10" },
    { name = "websockets", specifier = "==16.1.1" },
]
provides-extras = ["evaluation", "test"]

[package.metadata.requires-dev]
dev = [{ name = "ruff", specifier = "==0.16.0" }]
