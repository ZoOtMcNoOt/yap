[project]
name = "yap-server"
version = "0.1.0"
description = "Yap server-tier staging package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.0.0",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "pyjwt[crypto]==2.13.0",
    "pyyaml==6.0.3",
    "websockets==16.1.1",
]

[project.scripts]
yap-server = "yap_server.__main__:main"

[project.optional-dependencies]
evaluation = [
    "rapidfuzz==3.14.5",
    "regex==2026.7.10",
]
test = [
    "numpy==2.4.6",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
