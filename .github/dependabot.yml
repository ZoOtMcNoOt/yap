version: 2
# One grouped pull request per ecosystem per week. Ungrouped bumps each needed
# their own regeneration of the shipped dependency inventory, so a quiet week
# of patch releases produced several pull requests that were all individually
# unmergeable.
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      wdio-core:
        patterns:
          - "@wdio/cli"
          - "@wdio/local-runner"
          - "@wdio/mocha-framework"
          - "@wdio/spec-reporter"
          - webdriverio
      wdio-tauri:
        patterns:
          - "@wdio/tauri-plugin"
          - "@wdio/tauri-service"
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # windows 0.62 exposes windows-future 0.3 WinRT types. Updating this
      # independently to 0.100 breaks WAM; revisit with the Windows bindings.
      - dependency-name: windows-future
        versions:
          - ">=0.100.0"
      - dependency-name: cpal
        versions:
          - 0.18.0
          - 0.18.1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
