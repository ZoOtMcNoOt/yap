name: Desktop package smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            sherpa_platform: linux-x86_64
          - runner: macos-15
            sherpa_platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev
      - name: Verify native speech runtime archive
        env:
          SHERPA_PLATFORM: ${{ matrix.sherpa_platform }}
        run: |
          python3 verification/stage-desktop-speech-runtime.py "$SHERPA_PLATFORM" "$RUNNER_TEMP"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build native desktop package
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          pnpm --dir .. install --frozen-lockfile
          pnpm --dir .. tauri build --debug --ci -- --locked
      - name: Verify native model snapshots and saved dictation
        working-directory: desktop/src-tauri
        run: |
          set -o pipefail
          for suite in stt::nemotron::tests::loading:: live::recordings::tests::transcripts:: live::state::tests::lifecycle::; do
            cargo test --locked --lib "$suite" -- --test-threads=1 | tee "$RUNNER_TEMP/native-dictation-tests.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/native-dictation-tests.log"
          done
      - name: Transcribe the licensed recording with the pinned desktop recognizer
        run: python3 verification/test-desktop-dictation.py
      - name: Check installed Debian package
        if: runner.os == 'Linux'
        run: |
          container=$(docker run -d --init --network bridge \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checks,readonly" --workdir /checks \
            debian:13-slim@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0 sleep infinity)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker exec "$container" sh -ec '
              apt-get -o APT::Update::Error-Mode=any update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ./desktop/src-tauri/target/debug/bundle/deb/*.deb python3 python3-pyatspi xvfb xauth x11-utils dbus-x11
            '
          docker network disconnect bridge "$container"
          docker exec "$container" sh -ec '
              test "$(ls /sys/class/net)" = lo
              echo "Only the loopback interface is present for the desktop lifecycle check."
              useradd --create-home yap-smoke
              test_home=$(runuser -u yap-smoke -- mktemp -d)
              profile="$test_home/.local/share/com.mcnatg1.yap"
              check_launch() {
                runuser -u yap-smoke -- dbus-run-session -- xvfb-run -a \
                  python3 verification/test-desktop-package.py --test-home "$test_home" "$@"
              }
              check_profile() {
                runuser -u yap-smoke -- python3 verification/package-profile.py "$1" "$profile"
              }
              check_launch
              check_profile seed
              dpkg -r yap
              test ! -e /usr/bin/yap-desktop
              check_profile verify
              dpkg -i ./desktop/src-tauri/target/debug/bundle/deb/*.deb
              check_launch --check-saved-history
              check_profile verify
            '
      - name: Install and launch the macOS app after ejecting its disk image
        if: runner.os == 'macOS'
        run: bash verification/test-macos-dmg.sh desktop/src-tauri/target/debug/bundle/dmg/*.dmg
