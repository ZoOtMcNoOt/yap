          if ($CurrentPowerShellSha256 -cne $ExpectedPowerShellSha256) {
            throw 'The admitted PowerShell host changed after initial verification.'
          }
          $GitExecutable = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.git_executable_base64 }}'
            )
          )
          $RepositoryRoot = $Utf8.GetString(
            [Convert]::FromBase64String(
