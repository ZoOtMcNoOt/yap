      - run: pnpm install --frozen-lockfile
      - name: Verify release-evidence configuration
        run: pnpm test:release-contract
      - name: Build the WDIO-enabled app once
        run: pnpm test:desktop:build
      - name: Run required hardware-independent WDIO specs
        working-directory: ${{ github.workspace }}
        env:
          YAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node ./verification/run-hosted-windows-runtime-check.mjs native-wdio
      - name: Verify exact GitHub-hosted checkout remained unchanged
        shell: 'C:\Windows\System32\cmd.exe /d /s /c ""C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -Command - < "{0}""'
        working-directory: ${{ github.workspace }}
        run: |
