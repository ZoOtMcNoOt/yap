            throw 'The admitted PowerShell host changed after initial verification.'
          }
          $GitExecutable = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.git_executable_base64 }}'
            )
          )
          $RepositoryRoot = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.repository_root_base64 }}'
            )
          )
          $GuardBlock = [ScriptBlock]::Create($Utf8.GetString($GuardBytes))
          & $GuardBlock `
            -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -VerificationStage Final `
            -RunnerEnvironment '${{ runner.environment }}' `
            -ExpectedRunnerOs Windows `
            -GitExecutable $GitExecutable `
            -ExpectedGitSha256 '${{ steps.exact_head_checkout.outputs.git_sha256 }}' `
            -RepositoryRoot $RepositoryRoot `
            -ExpectedTrackedManifestSha256 '${{ steps.exact_head_checkout.outputs.tracked_manifest_sha256 }}' `
            -ExpectedGitIndexSha256 '${{ steps.exact_head_checkout.outputs.git_index_sha256 }}'
      - name: Save Cargo dependency downloads from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  native-wdio:
    name: Native WDIO smoke (required, no hardware)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      RUST_TARGET: x86_64-pc-windows-msvc
      RUST_TOOLCHAIN: stable
      YAP_CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
