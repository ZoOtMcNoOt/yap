name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      POWERSHELL_74_SHA256: 266479A93B82CD0DC0F043419388FD4A738A51082821C301FFF497212FAF6760
      POWERSHELL_74_VERSION: 7.4.17
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify PowerShell 7.4 Core
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -cne "Core" -or $PSVersionTable.PSVersion -lt [version]"7.4") {
            throw "CI requires PowerShell Core 7.4 or newer."
          }
      - name: Verify exact GitHub-hosted checkout
        id: exact_head_checkout
        shell: 'C:\Windows\System32\cmd.exe /d /s /c ""C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -Command - < "{0}""'
        working-directory: ${{ github.workspace }}
        run: |
          ./verification/initialize-github-hosted-checkout-proof.ps1 `
            -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -RunnerEnvironment '${{ runner.environment }}' `
            -ExpectedRunnerOs Windows `
            -GitCommandName git.exe `
            -ExpectedPowerShellExecutable 'C:\Program Files\PowerShell\7\pwsh.exe' `
            -OutputFile $env:GITHUB_OUTPUT
      - name: Install pinned PowerShell 7.4 runtime
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-$env:POWERSHELL_74_VERSION-win-x64.zip"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "powershell-$env:POWERSHELL_74_VERSION"
          $uri = "https://github.com/PowerShell/PowerShell/releases/download/v$env:POWERSHELL_74_VERSION/PowerShell-$env:POWERSHELL_74_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -cne $env:POWERSHELL_74_SHA256) {
            throw "Pinned PowerShell archive hash mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeRoot -Force
          $runtime = Join-Path $runtimeRoot "pwsh.exe"
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "Pinned PowerShell runtime was not extracted."
          }
          "YAP_POWERSHELL_74=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run focused suite under PowerShell 7.4
        run: |
          $identityJson = & $env:YAP_POWERSHELL_74 -NoProfile -NonInteractive -Command '[ordered]@{ PSEdition = $PSVersionTable.PSEdition; PSVersion = $PSVersionTable.PSVersion.ToString() } | ConvertTo-Json -Compress'
          if ($LASTEXITCODE -ne 0) { throw "Pinned PowerShell identity probe failed." }
          $identity = $identityJson | ConvertFrom-Json
          if ($identity.PSEdition -cne "Core" -or [version]$identity.PSVersion -ne [version]$env:POWERSHELL_74_VERSION) {
            throw "Pinned PowerShell runtime identity does not match the compatibility lane."
          }

          $nestedRuntime = & $env:YAP_POWERSHELL_74 -NoProfile -NonInteractive -Command '(Get-Command pwsh.exe -CommandType Application | Select-Object -First 1).Source'
          if ($LASTEXITCODE -ne 0 -or [System.IO.Path]::GetFullPath($nestedRuntime) -ine [System.IO.Path]::GetFullPath($env:YAP_POWERSHELL_74)) {
            throw "Nested PowerShell commands do not resolve to the pinned compatibility runtime."
          }

          $parserProbe = @'
          $ErrorActionPreference = "Stop"
          $files = @(git ls-files -- "*.ps1" "*.psm1")
          if ($files.Count -eq 0) { throw "No tracked PowerShell files were found." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file failed PowerShell 7.4 parsing: $($errors.Message -join '; ')"
            }
          }
          '@
          & $env:YAP_POWERSHELL_74 -NoProfile -NonInteractive -Command $parserProbe
          if ($LASTEXITCODE -ne 0) { throw "Tracked scripts failed PowerShell 7.4 parsing." }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind pnpm dependency store
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\desktop\tests\scripts\bind-pnpm-cache-store.ps1"

      - name: Restore pnpm dependency store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\pnpm\store\v11
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - name: Restore Playwright browser downloads
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies with documented workspace policy
        run: pnpm audit:dependencies
      - run: pnpm test:release-contract
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Verify exact GitHub-hosted checkout remained unchanged
        shell: 'C:\Windows\System32\cmd.exe /d /s /c ""C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -Command - < "{0}""'
        working-directory: ${{ github.workspace }}
        run: |
          $GuardBytes = [Convert]::FromBase64String(
            '${{ steps.exact_head_checkout.outputs.guard_source_base64 }}'
          )
          $ExpectedGuardSha256 = '${{ steps.exact_head_checkout.outputs.guard_sha256 }}'
          if ($ExpectedGuardSha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The admitted exact-head guard identity is malformed.'
          }
          $GuardSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($GuardBytes)
          ).ToLowerInvariant()
          if ($GuardSha256 -cne $ExpectedGuardSha256) {
            throw 'The admitted exact-head guard source changed after initial verification.'
          }
          $Utf8 = [Text.UTF8Encoding]::new($false, $true)
          $ExpectedPowerShellSha256 = '${{ steps.exact_head_checkout.outputs.powershell_sha256 }}'
          if ($ExpectedPowerShellSha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The admitted PowerShell host identity is malformed.'
          }
          $PowerShellExecutable = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.powershell_executable_base64 }}'
            )
          )
          $CurrentPowerShellExecutable = [IO.Path]::GetFullPath(
            [Environment]::ProcessPath
          )
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals(
            [IO.Path]::GetFullPath($PowerShellExecutable),
            $CurrentPowerShellExecutable
          )) {
            throw 'The final exact-head proof started in a substituted PowerShell host.'
          }
          $CurrentPowerShellSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData(
              [IO.File]::ReadAllBytes($CurrentPowerShellExecutable)
            )
          ).ToLowerInvariant()
          if ($CurrentPowerShellSha256 -cne $ExpectedPowerShellSha256) {
            throw 'The admitted PowerShell host changed after initial verification.'
          }
          $GitExecutable = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.git_executable_base64 }}'
            )
          )
          $RepositoryRoot = $Utf8.GetString(
            [Convert]::FromBase64String(
              '${{ steps.exact_head_checkout.outputs.repository_root_base64 }}'
            )
          )
          $GuardBlock = [ScriptBlock]::Create($Utf8.GetString($GuardBytes))
          & $GuardBlock `
            -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -VerificationStage Final `
            -RunnerEnvironment '${{ runner.environment }}' `
            -ExpectedRunnerOs Windows `
            -GitExecutable $GitExecutable `
            -ExpectedGitSha256 '${{ steps.exact_head_checkout.outputs.git_sha256 }}' `
            -RepositoryRoot $RepositoryRoot `
            -ExpectedTrackedManifestSha256 '${{ steps.exact_head_checkout.outputs.tracked_manifest_sha256 }}' `
            -ExpectedGitIndexSha256 '${{ steps.exact_head_checkout.outputs.git_index_sha256 }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: frontend-test-artifacts
          path: |
            desktop/tests/results/playwright
          if-no-files-found: warn
      - name: Save pnpm dependency store from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\pnpm\store\v11
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Save Playwright downloads from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      YAP_CHECKED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify PowerShell 7.4 Core
        shell: pwsh
        run: |
          if ($PSVersionTable.PSEdition -cne "Core" -or $PSVersionTable.PSVersion -lt [version]"7.4") {
            throw "CI requires PowerShell Core 7.4 or newer."
          }
      - name: Verify exact GitHub-hosted checkout
        id: exact_head_checkout
        shell: 'C:\Windows\System32\cmd.exe /d /s /c ""C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -Command - < "{0}""'
        working-directory: ${{ github.workspace }}
        run: |
          ./verification/initialize-github-hosted-checkout-proof.ps1 `
            -ExpectedHead '${{ github.event.pull_request.head.sha || github.sha }}' `
            -RunnerEnvironment '${{ runner.environment }}' `
            -ExpectedRunnerOs Windows `
            -GitCommandName git.exe `
            -ExpectedPowerShellExecutable 'C:\Program Files\PowerShell\7\pwsh.exe' `
            -OutputFile $env:GITHUB_OUTPUT
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Populate exact server dependencies for connector runtimes
        working-directory: server
        run: uv sync --locked --exact --python (Get-Command python.exe).Source --no-python-downloads
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Restore Cargo dependency downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Run exact server connector integration
        working-directory: ${{ github.workspace }}
        env:
          YAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node ./verification/run-hosted-windows-runtime-check.mjs server-connector
      - name: Run exact authenticated connector integration
        working-directory: ${{ github.workspace }}
        env:
          YAP_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node ./verification/run-hosted-windows-runtime-check.mjs authenticated-server-connector
      - name: Verify exact Windows dependency boundary
        working-directory: ${{ github.workspace }}
        run: ./verification/test-windows-rust-dependency-boundary.ps1
      - name: Audit exact Windows Rust dependencies
        working-directory: ${{ github.workspace }}
        run: ./verification/audit-windows-rust-dependencies.ps1
      - name: Verify exact GitHub-hosted checkout remained unchanged
        shell: 'C:\Windows\System32\cmd.exe /d /s /c ""C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -Command - < "{0}""'
        working-directory: ${{ github.workspace }}
        run: |
          $GuardBytes = [Convert]::FromBase64String(
            '${{ steps.exact_head_checkout.outputs.guard_source_base64 }}'
          )
          $ExpectedGuardSha256 = '${{ steps.exact_head_checkout.outputs.guard_sha256 }}'
          if ($ExpectedGuardSha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The admitted exact-head guard identity is malformed.'
          }
          $GuardSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($GuardBytes)
          ).ToLowerInvariant()
          if ($GuardSha256 -cne $ExpectedGuardSha256) {
            throw 'The admitted exact-head guard source changed after initial verification.'
          }
          $Utf8 = [Text.UTF8Encoding]::new($false, $true)
          $ExpectedPowerShellSha256 = '${{ steps.exact_head_checkout.outputs.powershell_sha256 }}'
