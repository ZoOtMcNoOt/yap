            -ExpectedRunnerOs Linux `
            -GitCommandName git `
            -ExpectedPowerShellExecutable '/opt/microsoft/powershell/7/pwsh' `
            -OutputFile $env:GITHUB_OUTPUT
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prove Linux executable-bit drift fails closed
        working-directory: desktop
        run: >-
          node --test
          --test-name-pattern "real Git executable-bit drift"
          tests/scripts/release-contract/github-hosted-checkout.contract.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Verify Linux PowerShell and Docker
        run: |
          if (
            $PSVersionTable.PSEdition -cne "Core" -or
            $PSVersionTable.PSVersion -lt [version]"7.4"
          ) {
            throw "Mock OIDC CI requires PowerShell Core 7.4 or newer."
          }
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Mock OIDC CI requires the hosted Docker service."
          }
      - name: Populate the exact mock OIDC dependency environment
        working-directory: server
        run: |
          $UvIdentity = (& uv --version)
          if ($LASTEXITCODE -ne 0 -or $UvIdentity -notmatch '^uv 0\.11\.21(?: |$)') {
            throw "Mock OIDC CI requires uv 0.11.21."
          }
          $PythonIdentity = (& python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          if ($LASTEXITCODE -ne 0 -or $PythonIdentity -cne "3.12") {
            throw "Mock OIDC CI requires Python 3.12."
          }
          $PythonCommand = Get-Command python -CommandType Application |
            Select-Object -First 1
          $Python = $PythonCommand.Source
          uv sync --locked --exact --python $Python --no-python-downloads
          if ($LASTEXITCODE -ne 0) {
            throw "Mock OIDC CI could not populate the locked server environment."
          }
      - name: Run required Linux owned-process lifecycle tests without skips
        shell: bash
        env:
          PYTHONPATH: server
          YAP_REQUIRE_LINUX_LIFECYCLE_TESTS: "1"
        run: |
          test -x /usr/bin/python3.12
          test "$(/usr/bin/python3.12 -I -S -c 'import sys; print(".".join(map(str, sys.version_info[:2])))')" = 3.12
          uv run --project server --locked python -m unittest -v \
            tests.infra.test_owned_process_group_behavior \
            tests.infra.test_owned_process_supervisor \
            tests.infra.test_resident_provider_lifecycle_gate \
            tests.infra.test_private_container_loopback_proxy \
            tests.infra.test_private_container_loopback_proxy_behavior
      - name: Run the pinned mock OIDC owner flow
        run: ./verification/test-mock-oidc-owner-flow.ps1
      - name: Verify exact GitHub-hosted checkout remained unchanged
        shell: /opt/microsoft/powershell/7/pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        working-directory: ${{ github.workspace }}
        run: |
